# Tiny Tapeout project information
project:
  title:        "8 bit binary counter"      # Project title
  author:       "Hugh Ding"      # Your name
  discord:      "hd9189"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8 bit progrommable binary counter with async reset"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_8_bit_counter"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (Control signals)
  ui[0]: "load_en (1: load preset on clk)"
  ui[1]: "count_en (1: count, 0: pause)"
  ui[2]: "oe (1: enable tri-state output, 0: High-Z)"
  ui[3]: "unused"
  ui[4]: "unused"
  ui[5]: "unused"
  ui[6]: "unused"
  ui[7]: "unused"

  # Outputs (Dedicated outputs - displays current counter value)
  uo[0]: "count[0] (LSB)"
  uo[1]: "count[1]"
  uo[2]: "count[2]"
  uo[3]: "count[3]"
  uo[4]: "count[4]"
  uo[5]: "count[5]"
  uo[6]: "count[6]"
  uo[7]: "count[7] (MSB)"

  # Bidirectional pins (Shared 8-bit Data Bus)
  # When oe=0: Input path (loads preset value)
  # When oe=1: Output path (drives counter value)
  uio[0]: "data[0] (bidir bus bit 0)"
  uio[1]: "data[1] (bidir bus bit 1)"
  uio[2]: "data[2] (bidir bus bit 2)"
  uio[3]: "data[3] (bidir bus bit 3)"
  uio[4]: "data[4] (bidir bus bit 4)"
  uio[5]: "data[5] (bidir bus bit 5)"
  uio[6]: "data[6] (bidir bus bit 6)"
  uio[7]: "data[7] (bidir bus bit 7)"

# Do not change!
yaml_version: 6
